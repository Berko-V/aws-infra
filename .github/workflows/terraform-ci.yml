name: Terraform CI (plan)

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging]

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Debug AWS profile env (safe)
        run: |
          env | egrep '^AWS_(PROFILE|DEFAULT_PROFILE|SDK_LOAD_CONFIG|CONFIG_FILE|SHARED_CREDENTIALS_FILE)=' || true

      - name: Unset AWS profile env for Terraform
        run: |
          echo "Unsetting AWS profile-related env vars for Terraform provider"
          unset AWS_PROFILE AWS_DEFAULT_PROFILE AWS_SDK_LOAD_CONFIG AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE

      - name: Write backend config (generated)
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ secrets.TF_STATE_BUCKET }}"
          key            = "aws-terraform-demo/${{ matrix.env }}/terraform.tfstate"
          region         = "${{ secrets.AWS_REGION }}"
          dynamodb_table = "terraform-locks"
          encrypt        = true
          EOF

      - name: Terraform init
        run: |
          unset AWS_PROFILE AWS_DEFAULT_PROFILE AWS_SDK_LOAD_CONFIG AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE
          terraform init -reconfigure -backend-config=backend.hcl

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (${{ matrix.env }})
        run: |
          unset AWS_PROFILE AWS_DEFAULT_PROFILE AWS_SDK_LOAD_CONFIG AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE
          terraform plan -var-file=env/${{ matrix.env }}.tfvars -no-color